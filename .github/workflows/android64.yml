name: Build BetterVisuals GSR1 + FSR 1 and 1.2 (Android ARM64)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android64 Geode build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BetterVisuals upstream
        uses: actions/checkout@v4
        with:
          repository: ItMe12s/BetterVisuals
          ref: master

      - name: Checkout integration overlay
        uses: actions/checkout@v4
        with:
          path: integration

      - name: Apply SGSR1 and FSR integration
        run: |
          cp integration/integration/apply_patch.py ./apply_sgsr1_patch.py
          cp integration/integration/Sgsr1Shader.cpp ./src/shaders/Sgsr1Shader.cpp
          cp integration/integration/FsrRcasShader.cpp ./src/shaders/upscale/FsrRcasShader.cpp
          cp integration/integration/Fsr12Renderer.hpp ./src/render/Fsr12Renderer.hpp
          cp integration/integration/Fsr12Renderer.cpp ./src/render/Fsr12Renderer.cpp
          python3 ./apply_sgsr1_patch.py
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          mod = json.loads(Path('mod.json').read_text())
          version = mod.get('version')
          assert isinstance(version, str), 'mod.json version must be a string'
          assert re.fullmatch(r'v\d+\.\d+\.\d+(?:-(?:alpha|beta|prerelease|pr)(?:\.\d+)?)?', version), f'Invalid Geode version: {version!r}'
          assert mod.get('id') == 'tiromixo2013.bettervisuals-gsr'
          print(f"Validated Geode metadata: {mod['id']} {version}")
          PY
          test -s src/shaders/Sgsr1Shader.cpp
          test -s src/shaders/upscale/FsrRcasShader.cpp
          test -s src/render/Fsr12Renderer.hpp
          test -s src/render/Fsr12Renderer.cpp

      - name: Build Android ARM64 Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: Android64

  package:
    name: Package Android64 Geode build
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Combine Geode build
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload Geode package
        uses: actions/upload-artifact@v4
        with:
          name: BetterVisuals-GSR1-Android64
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 14
