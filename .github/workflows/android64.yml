name: Build BetterVisuals GSR1 + FSR 1 + Frame Generation (Android ARM64)
on:
  push:
    branches: [main, feature/frame-generation-prototype]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Android64 Geode mod build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BetterVisuals upstream
        uses: actions/checkout@v4
        with:
          repository: ItMe12s/BetterVisuals
          ref: master
      - name: Checkout integration overlay
        uses: actions/checkout@v4
        with:
          path: integration
      - name: Apply and validate custom Geode Android Loader bridge
        run: |
          git clone --filter=blob:none https://github.com/geode-sdk/geode.git /tmp/geode-loader
          git -C /tmp/geode-loader checkout d22af2464ec97ab6c0fbef18004e82f3d2f36713
          python3 "$GITHUB_WORKSPACE/integration/loader-patch/apply_loader_patch.py" /tmp/geode-loader
          git -C /tmp/geode-loader diff --check
          grep -q "nativePresentGeneratedFrame" /tmp/geode-loader/loader/include/Geode/cocos/platform/android/java/src/org/cocos2dx/lib/Cocos2dxRenderer.java
          grep -q "GeodeSetFrameGenerationPresentCallback" /tmp/geode-loader/loader/include/Geode/cocos/platform/android/jni/Java_org_cocos2dx_lib_Cocos2dxRenderer.cpp
      - name: Apply SGSR1, FSR 1, and Frame Generation integration
        run: |
          cp integration/integration/apply_patch.py ./apply_sgsr1_patch.py
          cp integration/integration/Sgsr1Shader.cpp ./src/shaders/Sgsr1Shader.cpp
          python3 ./apply_sgsr1_patch.py
          cp integration/integration/FrameInterpolationRenderer.hpp ./src/render/FrameInterpolationRenderer.hpp
          cp integration/integration/FrameInterpolationRenderer.cpp ./src/render/FrameInterpolationRenderer.cpp
          cp integration/integration/apply_frame_generation.py ./apply_frame_generation.py
          python3 ./apply_frame_generation.py
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          mod = json.loads(Path('mod.json').read_text())
          version = mod.get('version')
          assert isinstance(version, str), 'mod.json version must be a string'
          assert re.fullmatch(r'v\d+\.\d+\.\d+(?:-(?:alpha|beta|prerelease|pr)(?:\.\d+)?)?', version), f'Invalid Geode version: {version!r}'
          assert mod.get('id') == 'tiromixo2013.bettervisuals-gsr'
          assert mod['settings']['frame-generation-enabled']['default'] is False
          print(f"Validated Geode metadata and Frame Generation setting: {mod['id']} {version}")
          PY
          test -s src/shaders/Sgsr1Shader.cpp
          test -s src/render/FrameInterpolationRenderer.cpp
      - name: Build Android ARM64 Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: Android64
  package:
    name: Package Android64 Geode mod
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Combine Geode build
        uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - name: Fix packaged Geode compatibility metadata
        env:
          BUILD_OUTPUT: ${{ steps.build.outputs.build-output }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, tempfile, zipfile
          raw = os.environ.get("BUILD_OUTPUT", "")
          candidates = []
          if raw:
              p = pathlib.Path(raw)
              if p.is_file() and p.suffix == ".geode":
                  candidates.append(p)
              elif p.is_dir():
                  candidates.extend(p.rglob("*.geode"))
          if not candidates:
              candidates = list(pathlib.Path.cwd().rglob("*.geode"))
          candidates = list(dict.fromkeys(p.resolve() for p in candidates if p.is_file()))
          if len(candidates) != 1:
              raise SystemExit(f"Expected exactly one .geode package, found {len(candidates)}: {candidates}")
          package = candidates[0]
          with zipfile.ZipFile(package, "r") as src:
              entries = [(i, src.read(i.filename)) for i in src.infolist()]
          manifest_entries = [n for n, data in entries if n.filename == "mod.json"]
          if len(manifest_entries) != 1:
              raise SystemExit(f"Expected one root mod.json, found {len(manifest_entries)}")
          updated = []
          for info, data in entries:
              if info.filename == "mod.json":
                  mod = json.loads(data.decode("utf-8"))
                  if mod.get("id") != "tiromixo2013.bettervisuals-gsr":
                      raise SystemExit(f"Unexpected mod id: {mod.get('id')!r}")
                  mod["geode"] = "v5.11.2"
                  data = (json.dumps(mod, indent=2) + "\n").encode("utf-8")
              updated.append((info, data))
          fd, temp_name = tempfile.mkstemp(suffix=".geode", dir=package.parent)
          os.close(fd)
          try:
              with zipfile.ZipFile(temp_name, "w") as dst:
                  for info, data in updated:
                      dst.writestr(info, data)
              with zipfile.ZipFile(temp_name, "r") as check:
                  mod = json.loads(check.read("mod.json"))
                  assert mod["geode"] == "v5.11.2", mod.get("geode")
                  assert mod["id"] == "tiromixo2013.bettervisuals-gsr"
                  assert any(n.endswith(".android64.so") for n in check.namelist())
                  assert check.testzip() is None
              os.replace(temp_name, package)
          finally:
              if os.path.exists(temp_name):
                  os.unlink(temp_name)
          print(f"Patched and validated {package}: geode={mod['geode']}, id={mod['id']}")
          PY
      - name: Upload Geode package
        uses: actions/upload-artifact@v4
        with:
          name: BetterVisuals-FSR1-SGSR1-FrameGeneration-Android64
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 14
